<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="elicitation のやりとり">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="30" y="30" width="140" height="36" rx="7" fill="url(#i1)"/>
	<text x="100" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">サーバー</text>
	<line x1="100" y1="66" x2="100" y2="200" stroke="#d9dfe8" stroke-width="2"/>

	<rect x="380" y="30" width="140" height="36" rx="7" fill="url(#i1)"/>
	<text x="450" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">クライアント</text>
	<line x1="450" y1="66" x2="450" y2="200" stroke="#d9dfe8" stroke-width="2"/>

	<rect x="730" y="30" width="140" height="36" rx="7" fill="url(#i1)"/>
	<text x="800" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">利用者</text>
	<line x1="800" y1="66" x2="800" y2="200" stroke="#d9dfe8" stroke-width="2"/>

	<line x1="100" y1="95" x2="450" y2="95" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)"/>
	<text x="275" y="88" text-anchor="middle" font-size="11" fill="#1c2330">elicitation/create</text>

	<line x1="450" y1="125" x2="800" y2="125" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)"/>
	<text x="625" y="118" text-anchor="middle" font-size="11" fill="#1c2330">画面に出す</text>

	<line x1="800" y1="155" x2="450" y2="155" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)"/>
	<text x="625" y="148" text-anchor="middle" font-size="11" fill="#1c2330">入力する</text>

	<line x1="450" y1="185" x2="100" y2="185" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)"/>
	<text x="275" y="178" text-anchor="middle" font-size="11" fill="#1c2330">action と content</text>

	<text x="450" y="225" text-anchor="middle" font-size="11" fill="#4a5568">ツールの処理を止めたまま待つ。利用者が答えるまで結果は返せない</text>
</svg>
