<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="出力の1行ごとに進捗が流れる">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="30" y="60" width="180" height="100" rx="9" fill="#97a1ae"/>
	<text x="120" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">子プロセス</text>
	<text x="120" y="112" text-anchor="middle" font-size="11" fill="#fff">stdout / stderr</text>
	<text x="120" y="134" text-anchor="middle" font-size="11" fill="#fff">1 行ずつ出る</text>

	<line x1="210" y1="110" x2="290" y2="110" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="290" y="60" width="200" height="100" rx="9" fill="url(#i1)"/>
	<text x="390" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">サーバー</text>
	<text x="390" y="112" text-anchor="middle" font-size="11" fill="#fff">溜めつつ</text>
	<text x="390" y="134" text-anchor="middle" font-size="11" fill="#fff">1 行ごとに通知</text>

	<line x1="490" y1="90" x2="600" y2="65" stroke="#1d7a3c" stroke-width="2" marker-end="url(#i2)"/>
	<rect x="600" y="42" width="270" height="46" rx="8" fill="#1d7a3c"/>
	<text x="735" y="62" text-anchor="middle" font-size="11" fill="#fff">進捗（途中で何度も）</text>
	<text x="735" y="79" text-anchor="middle" font-size="10" fill="#fff">notifications/progress</text>

	<line x1="490" y1="135" x2="600" y2="160" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
	<rect x="600" y="138" width="270" height="46" rx="8" fill="#ffffff" stroke="#d9dfe8" stroke-width="2"/>
	<text x="735" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#1c2330">結果（最後に 1 回）</text>
	<text x="735" y="175" text-anchor="middle" font-size="10" fill="#4a5568">末尾 30 行だけ</text>
</svg>
