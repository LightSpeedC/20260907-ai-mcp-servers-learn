<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="HTTPリクエストがtransportに渡るまで">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="20" y="70" width="150" height="50" rx="8" fill="url(#i1)"/>
	<text x="95" y="92" text-anchor="middle" font-size="12" fill="#fff">POST /mcp</text>
	<text x="95" y="110" text-anchor="middle" font-size="11" fill="#fff">JSON-RPC が本文</text>

	<line x1="170" y1="95" x2="225" y2="95" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="225" y="70" width="160" height="50" rx="8" fill="#ffffff" stroke="#d9dfe8"/>
	<text x="305" y="92" text-anchor="middle" font-size="12" fill="#1c2330">node:http</text>
	<text x="305" y="110" text-anchor="middle" font-size="11" fill="#4a5568">req, res</text>

	<line x1="385" y1="95" x2="440" y2="95" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="440" y="70" width="200" height="50" rx="8" fill="#ffffff" stroke="#d9dfe8"/>
	<text x="540" y="92" text-anchor="middle" font-size="12" fill="#1c2330">transport</text>
	<text x="540" y="110" text-anchor="middle" font-size="11" fill="#4a5568">.handleRequest(req, res)</text>

	<line x1="640" y1="95" x2="695" y2="95" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="695" y="70" width="180" height="50" rx="8" fill="#1d7a3c"/>
	<text x="785" y="92" text-anchor="middle" font-size="12" fill="#fff">memo-tools.mjs</text>
	<text x="785" y="110" text-anchor="middle" font-size="11" fill="#fff">06 章と同じもの</text>

	<text x="450" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2330">書き換えたのは左半分だけ</text>
</svg>
