	<text x="835" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">11</text>
	<text x="835" y="138" text-anchor="middle" font-size="10" fill="#fff">総仕上げ</text>

	<text x="450" y="230" text-anchor="middle" font-size="11" fill="#4a5568">06 で作ったものを 07〜10 で育て、11 で別の題材に当てはめる</text>
