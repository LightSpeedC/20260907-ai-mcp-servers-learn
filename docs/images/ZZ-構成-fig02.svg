	<text x="265" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">06 メモ</text>
	<text x="265" y="138" text-anchor="middle" font-size="10" fill="#fff">ハンズオン①</text>

	<line x1="330" y1="112" x2="400" y2="70" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
	<line x1="330" y1="132" x2="400" y2="170" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="400" y="48" width="130" height="44" rx="7" fill="url(#i1)"/>
	<text x="465" y="76" text-anchor="middle" font-size="12" fill="#fff">07 HTTP</text>

	<rect x="400" y="150" width="130" height="44" rx="7" fill="url(#i1)"/>
	<text x="465" y="178" text-anchor="middle" font-size="12" fill="#fff">08 通知</text>

	<line x1="530" y1="70" x2="600" y2="105" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
