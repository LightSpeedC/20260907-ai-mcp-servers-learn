<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="メモサーバーの構成">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="40" y="40" width="170" height="130" rx="9" fill="url(#i1)"/>
	<text x="125" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ホスト</text>
	<text x="125" y="100" text-anchor="middle" font-size="11" fill="#fff">「さっきの件、</text>
	<text x="125" y="120" text-anchor="middle" font-size="11" fill="#fff">メモしておいて」</text>
	<text x="125" y="148" text-anchor="middle" font-size="11" fill="#fff">「mcp の話あった？」</text>

	<line x1="210" y1="80" x2="330" y2="80" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
	<text x="270" y="72" text-anchor="middle" font-size="11" fill="#4a5568">memo_add</text>
	<line x1="210" y1="135" x2="330" y2="135" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
	<text x="270" y="127" text-anchor="middle" font-size="11" fill="#4a5568">memo_search</text>

	<rect x="330" y="40" width="250" height="130" rx="9" fill="#1d7a3c"/>
	<text x="455" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">メモサーバー</text>
	<text x="455" y="100" text-anchor="middle" font-size="11" fill="#fff">追記する / 探す</text>
	<text x="455" y="126" text-anchor="middle" font-size="11" fill="#fff">memo://all で全部読む</text>
	<text x="455" y="150" text-anchor="middle" font-size="11" fill="#fff">状態は持たない</text>

	<line x1="580" y1="105" x2="700" y2="105" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)" marker-start="url(#i2)"/>

	<rect x="700" y="65" width="160" height="80" rx="9" fill="#ffffff" stroke="#d9dfe8" stroke-width="2"/>
	<text x="780" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2330">memo.jsonl</text>
	<text x="780" y="118" text-anchor="middle" font-size="11" fill="#4a5568">1 行 1 件の JSON</text>

	<text x="450" y="210" text-anchor="middle" font-size="11" fill="#4a5568">サーバー自身は何も覚えない。覚えるのはファイル側の役目</text>
</svg>
