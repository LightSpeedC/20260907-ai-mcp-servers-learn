	<text x="450" y="126" text-anchor="middle" font-size="11" fill="#fff">1 回書けば、どの運び方でも使える</text>

	<line x1="300" y1="95" x2="200" y2="60" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
	<rect x="30" y="35" width="170" height="46" rx="8" fill="#1d7a3c"/>
	<text x="115" y="55" text-anchor="middle" font-size="12" fill="#fff">server.mjs</text>
	<text x="115" y="72" text-anchor="middle" font-size="11" fill="#fff">stdio（06 章）</text>

	<line x1="300" y1="125" x2="200" y2="160" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
