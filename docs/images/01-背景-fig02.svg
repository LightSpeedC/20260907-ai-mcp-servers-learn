<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="JSON-RPC のやりとりの順序">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(210,78%,25%)"/>
			<stop offset="1" stop-color="hsl(210,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="40" y="20" width="150" height="40" rx="8" fill="url(#i1)"/>
	<text x="115" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">クライアント</text>
	<line x1="115" y1="60" x2="115" y2="215" stroke="#d9dfe8" stroke-width="2"/>

	<rect x="700" y="20" width="150" height="40" rx="8" fill="url(#i1)"/>
	<text x="775" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">サーバー</text>
	<line x1="775" y1="60" x2="775" y2="215" stroke="#d9dfe8" stroke-width="2"/>

	<line x1="115" y1="90" x2="775" y2="90" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)"/>
	<text x="445" y="83" text-anchor="middle" font-size="12" fill="#1c2330">initialize（名乗り合い）</text>

	<line x1="115" y1="125" x2="775" y2="125" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)"/>
	<text x="445" y="118" text-anchor="middle" font-size="12" fill="#1c2330">tools/list（何ができる？）</text>

	<line x1="775" y1="155" x2="115" y2="155" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)" stroke-dasharray="5 3"/>
	<text x="445" y="148" text-anchor="middle" font-size="12" fill="#1c2330">ツールの一覧</text>

	<line x1="115" y1="185" x2="775" y2="185" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)"/>
	<text x="445" y="178" text-anchor="middle" font-size="12" fill="#1c2330">tools/call（これを実行して）</text>

	<line x1="775" y1="212" x2="115" y2="212" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)" stroke-dasharray="5 3"/>
	<text x="445" y="205" text-anchor="middle" font-size="12" fill="#1c2330">結果</text>
</svg>
