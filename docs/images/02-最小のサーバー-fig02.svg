<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="stdin・stdout・stderr の役割分担">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="40" y="80" width="180" height="80" rx="10" fill="url(#i1)"/>
	<text x="130" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ホスト</text>
	<text x="130" y="136" text-anchor="middle" font-size="11" fill="#fff">親プロセス</text>

	<rect x="480" y="80" width="200" height="80" rx="10" fill="#1d7a3c"/>
	<text x="580" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">サーバー</text>
	<text x="580" y="136" text-anchor="middle" font-size="11" fill="#fff">子プロセス（node）</text>

	<line x1="220" y1="100" x2="480" y2="100" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
	<text x="350" y="93" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2330">stdin</text>
	<text x="350" y="118" text-anchor="middle" font-size="11" fill="#4a5568">リクエストの JSON が 1 行ずつ届く</text>

	<line x1="480" y1="145" x2="220" y2="145" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
	<text x="350" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2330">stdout</text>
	<text x="350" y="163" text-anchor="middle" font-size="11" fill="#4a5568">応答の JSON だけを書く</text>

	<line x1="580" y1="160" x2="580" y2="205" stroke="#b8620a" stroke-width="2" marker-end="url(#i2)"/>
	<rect x="480" y="205" width="200" height="34" rx="7" fill="#ffffff" stroke="#b8620a"/>
	<text x="580" y="227" text-anchor="middle" font-size="12" fill="#b8620a">stderr（ログはこちら）</text>

	<text x="450" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">stdout は JSON-RPC 専用の通り道</text>
	<text x="450" y="60" text-anchor="middle" font-size="11" fill="#4a5568">ここに他のものを書くと通信が壊れる（第 5 章）</text>
</svg>
