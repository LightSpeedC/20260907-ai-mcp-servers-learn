<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="端末では混ざって見えるが、stdoutとstderrは別の流れ">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(70,78%,25%)"/><stop offset="1" stop-color="hsl(70,58%,55%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="40" y="30" width="330" height="140" rx="9" fill="#ffffff" stroke="#d9dfe8"/>
	<text x="205" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">端末で見ると</text>
	<text x="60" y="80" font-size="11" fill="#b8620a" font-family="monospace">[minimal] 起動した</text>
	<text x="60" y="100" font-size="11" fill="#1d7a3c" font-family="monospace">{"jsonrpc":"2.0","id":1,...}</text>
	<text x="60" y="120" font-size="11" fill="#b8620a" font-family="monospace">[minimal] 受信: ...</text>
	<text x="60" y="140" font-size="11" fill="#1d7a3c" font-family="monospace">{"jsonrpc":"2.0","id":2,...}</text>
	<text x="205" y="162" text-anchor="middle" font-size="11" fill="#4a5568">交互に並ぶ</text>

	<path d="M 385 100 L 425 100" stroke="#4a5568" stroke-width="2"/>
	<path d="M 420 94 L 430 100 L 420 106 Z" fill="#4a5568"/>

	<rect x="450" y="30" width="200" height="140" rx="9" fill="#ffffff" stroke="#1d7a3c" stroke-width="2"/>
	<text x="550" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#1d7a3c">stdout</text>
	<text x="470" y="80" font-size="11" fill="#1d7a3c" font-family="monospace">{"id":1,...}</text>
	<text x="470" y="100" font-size="11" fill="#1d7a3c" font-family="monospace">{"id":2,...}</text>
	<text x="550" y="140" text-anchor="middle" font-size="11" fill="#4a5568">ホストが読む</text>

	<rect x="670" y="30" width="190" height="140" rx="9" fill="#ffffff" stroke="#b8620a" stroke-width="2"/>
	<text x="765" y="54" text-anchor="middle" font-size="13" font-weight="700" fill="#b8620a">stderr</text>
	<text x="690" y="80" font-size="11" fill="#b8620a" font-family="monospace">[minimal] 起動した</text>
	<text x="690" y="100" font-size="11" fill="#b8620a" font-family="monospace">[minimal] 受信: ...</text>
	<text x="765" y="140" text-anchor="middle" font-size="11" fill="#4a5568">人が読む</text>
</svg>
