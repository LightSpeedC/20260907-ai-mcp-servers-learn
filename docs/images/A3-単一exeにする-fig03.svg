<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="ソースからexeまでの流れ">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="50" y="60" width="180" height="60" rx="8" fill="url(#i1)"/>
	<text x="140" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Server.cs</text>
	<text x="140" y="106" text-anchor="middle" font-size="11" fill="#fff">1 ファイル</text>

	<line x1="230" y1="90" x2="320" y2="90" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
	<text x="275" y="82" text-anchor="middle" font-size="11" fill="#4a5568">csc.exe</text>

	<rect x="320" y="60" width="230" height="60" rx="8" fill="#ffffff" stroke="#d9dfe8" stroke-width="2"/>
	<text x="435" y="86" text-anchor="middle" font-size="12" fill="#1c2330">OS に最初から入っている</text>
	<text x="435" y="106" text-anchor="middle" font-size="11" fill="#4a5568">追加のインストール不要</text>

	<line x1="550" y1="90" x2="640" y2="90" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="640" y="60" width="210" height="60" rx="8" fill="#1d7a3c"/>
	<text x="745" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">mcp-server.exe</text>
	<text x="745" y="106" text-anchor="middle" font-size="11" fill="#fff">7,680 バイト</text>

	<text x="450" y="160" text-anchor="middle" font-size="11" fill="#4a5568">ビルド環境の用意が要らないのが、この方法の値打ち</text>
</svg>
