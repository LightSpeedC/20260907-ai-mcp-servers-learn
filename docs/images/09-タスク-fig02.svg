<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="タスクが使われるには3つの条件が揃う必要がある">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="40" y="50" width="240" height="70" rx="9" fill="url(#i1)"/>
	<text x="160" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">① サーバーが名乗る</text>
	<text x="160" y="100" text-anchor="middle" font-size="11" fill="#fff">capabilities.tasks</text>

	<rect x="330" y="50" width="240" height="70" rx="9" fill="url(#i1)"/>
	<text x="450" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">② ツールが許す</text>
	<text x="450" y="100" text-anchor="middle" font-size="11" fill="#fff">execution.taskSupport</text>

	<rect x="620" y="50" width="240" height="70" rx="9" fill="url(#i1)"/>
	<text x="740" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">③ ホストが対応</text>
	<text x="740" y="100" text-anchor="middle" font-size="11" fill="#fff">capabilities.tasks を名乗る</text>

	<text x="303" y="92" text-anchor="middle" font-size="20" font-weight="700" fill="#4a5568">＋</text>
	<text x="595" y="92" text-anchor="middle" font-size="20" font-weight="700" fill="#4a5568">＋</text>

	<path d="M 450 120 L 450 150" stroke="#4a5568" stroke-width="2"/>
	<path d="M 444 145 L 450 155 L 456 145 Z" fill="#4a5568"/>

	<rect x="280" y="158" width="340" height="46" rx="8" fill="#1d7a3c"/>
	<text x="450" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">はじめてタスクとして呼ばれる</text>

	<text x="450" y="228" text-anchor="middle" font-size="11" fill="#a51f22">1 つでも欠けると、普通の呼び出しになる（エラーにはならない）</text>
</svg>
