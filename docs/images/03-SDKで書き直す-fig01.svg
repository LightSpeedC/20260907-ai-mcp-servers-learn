<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="SDK が受け持つ範囲と自分が書く範囲">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="60" y="35" width="780" height="46" rx="8" fill="url(#i1)"/>
	<text x="450" y="56" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">自分が書くところ</text>
	<text x="450" y="74" text-anchor="middle" font-size="11" fill="#fff">ツールの名前・説明・入力の形・中身の処理</text>

	<rect x="60" y="92" width="780" height="46" rx="8" fill="#e8ecf3" stroke="#d9dfe8"/>
	<text x="450" y="113" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2330">SDK が受け持つところ</text>
	<text x="450" y="131" text-anchor="middle" font-size="11" fill="#4a5568">JSON-RPC の組み立て・initialize の応答・入力の検証・エラーの形式・通知の宛先</text>

	<rect x="60" y="149" width="780" height="34" rx="8" fill="#ffffff" stroke="#d9dfe8"/>
	<text x="450" y="171" text-anchor="middle" font-size="12" fill="#4a5568">stdio / HTTP（トランスポート）</text>
</svg>
