<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="許可リスト方式と任意実行の違い">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
		<marker id="i3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="225" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">任意のコマンドを受ける</text>
	<rect x="40" y="45" width="370" height="46" rx="7" fill="url(#i1)"/>
	<text x="225" y="73" text-anchor="middle" font-size="12" fill="#fff">command: "何でも書ける"</text>

	<line x1="225" y1="91" x2="225" y2="120" stroke="#4a5568" stroke-width="2" marker-end="url(#i3)"/>

	<rect x="40" y="128" width="370" height="90" rx="7" fill="#fdeaea" stroke="#a51f22" stroke-width="2"/>
	<text x="225" y="155" text-anchor="middle" font-size="12" fill="#1c2330">安全かどうかを判断するのは</text>
	<text x="225" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#a51f22">モデルとホストの承認だけ</text>
	<text x="225" y="205" text-anchor="middle" font-size="11" fill="#1c2330">承認を切っている環境では素通り</text>

	<text x="675" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">名前で選ばせる</text>
	<rect x="490" y="45" width="370" height="46" rx="7" fill="url(#i2)"/>
	<text x="675" y="73" text-anchor="middle" font-size="12" fill="#fff">name: "test" | "version" | "slow"</text>

	<line x1="675" y1="91" x2="675" y2="120" stroke="#4a5568" stroke-width="2" marker-end="url(#i3)"/>

	<rect x="490" y="128" width="370" height="90" rx="7" fill="#eaf6ee" stroke="#1d7a3c" stroke-width="2"/>
	<text x="675" y="155" text-anchor="middle" font-size="12" fill="#1c2330">実行できる範囲を決めるのは</text>
	<text x="675" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1d7a3c">commands.json を書いた人</text>
	<text x="675" y="205" text-anchor="middle" font-size="11" fill="#1c2330">承認の設定に関わらず範囲が保たれる</text>

	<text x="450" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2330">「何を実行できるか」を、実行時ではなく設計時に決める</text>
</svg>
