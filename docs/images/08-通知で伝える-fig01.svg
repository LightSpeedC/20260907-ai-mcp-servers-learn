<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="通知が流せるのは処理中の間だけ">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<line x1="60" y1="200" x2="860" y2="200" stroke="#4a5568" stroke-width="2"/>
	<text x="860" y="225" text-anchor="end" font-size="11" fill="#4a5568">時間</text>

	<rect x="230" y="60" width="330" height="120" rx="8" fill="url(#i1)" opacity="0.14"/>
	<line x1="230" y1="60" x2="230" y2="200" stroke="hsl(280,58%,55%)" stroke-width="2" stroke-dasharray="4 3"/>
	<line x1="560" y1="60" x2="560" y2="200" stroke="hsl(280,58%,55%)" stroke-width="2" stroke-dasharray="4 3"/>
	<text x="395" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="hsl(280,78%,25%)">tools/call を処理している間</text>

	<circle cx="230" cy="200" r="7" fill="hsl(280,78%,25%)"/>
	<text x="230" y="232" text-anchor="middle" font-size="11" fill="#1c2330">呼ばれた</text>

	<circle cx="560" cy="200" r="7" fill="hsl(280,78%,25%)"/>
	<text x="560" y="232" text-anchor="middle" font-size="11" fill="#1c2330">結果を返した</text>

	<line x1="300" y1="160" x2="300" y2="105" stroke="#1d7a3c" stroke-width="2" marker-end="url(#i2)"/>
	<line x1="395" y1="160" x2="395" y2="105" stroke="#1d7a3c" stroke-width="2" marker-end="url(#i2)"/>
	<line x1="490" y1="160" x2="490" y2="105" stroke="#1d7a3c" stroke-width="2" marker-end="url(#i2)"/>
	<text x="395" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#1d7a3c">通知を送れる</text>

	<line x1="680" y1="160" x2="680" y2="105" stroke="#a51f22" stroke-width="2" stroke-dasharray="5 4"/>
	<text x="680" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#a51f22">送れない</text>
	<text x="680" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#a51f22">×</text>

	<text x="450" y="258" text-anchor="middle" font-size="12" fill="#4a5568">結果を返した瞬間に通り道が閉じる。「返した後で知らせる」はできない</text>
</svg>
