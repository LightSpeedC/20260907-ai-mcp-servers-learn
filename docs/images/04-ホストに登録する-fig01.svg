<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="3つのホストの登録方法の違い">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(30,78%,25%)"/><stop offset="1" stop-color="hsl(30,58%,55%)"/>
		</linearGradient>
		<marker id="i4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="30" y="40" width="230" height="52" rx="8" fill="url(#i1)"/>
	<text x="145" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Claude Code</text>
	<text x="145" y="81" text-anchor="middle" font-size="11" fill="#fff">claude mcp add / .mcp.json</text>

	<rect x="30" y="102" width="230" height="52" rx="8" fill="url(#i2)"/>
	<text x="145" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Codex</text>
	<text x="145" y="143" text-anchor="middle" font-size="11" fill="#fff">codex mcp add / config.toml</text>

	<rect x="30" y="164" width="230" height="52" rx="8" fill="url(#i3)"/>
	<text x="145" y="187" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Antigravity</text>
	<text x="145" y="205" text-anchor="middle" font-size="11" fill="#fff">antigravity --add-mcp</text>

	<line x1="260" y1="66" x2="430" y2="120" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i4)"/>
	<line x1="260" y1="128" x2="430" y2="128" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i4)"/>
	<line x1="260" y1="190" x2="430" y2="136" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i4)"/>

	<rect x="430" y="100" width="230" height="56" rx="8" fill="#ffffff" stroke="#d9dfe8" stroke-width="2"/>
	<text x="545" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">同じことを言っている</text>
	<text x="545" y="143" text-anchor="middle" font-size="11" fill="#4a5568">node &lt;path&gt; を起動して</text>

	<line x1="660" y1="128" x2="730" y2="128" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i4)"/>

	<rect x="730" y="100" width="140" height="56" rx="8" fill="#1d7a3c"/>
	<text x="800" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">あなたの</text>
	<text x="800" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">サーバー</text>
</svg>
