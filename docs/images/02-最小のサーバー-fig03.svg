<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="3つのメソッドが呼ばれる順序">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="40" y="50" width="180" height="60" rx="9" fill="url(#i1)"/>
	<text x="130" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">initialize</text>
	<text x="130" y="96" text-anchor="middle" font-size="11" fill="#fff">名乗り合い（1 回）</text>

	<rect x="260" y="50" width="180" height="60" rx="9" fill="url(#i1)"/>
	<text x="350" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">tools/list</text>
	<text x="350" y="96" text-anchor="middle" font-size="11" fill="#fff">品書きを渡す</text>

	<rect x="480" y="50" width="180" height="60" rx="9" fill="url(#i1)"/>
	<text x="570" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">tools/call</text>
	<text x="570" y="96" text-anchor="middle" font-size="11" fill="#fff">実行する（何度でも）</text>

	<path d="M 220 80 L 255 80" stroke="#4a5568" stroke-width="2"/>
	<path d="M 250 74 L 260 80 L 250 86 Z" fill="#4a5568"/>
	<path d="M 440 80 L 475 80" stroke="#4a5568" stroke-width="2"/>
	<path d="M 470 74 L 480 80 L 470 86 Z" fill="#4a5568"/>
	<path d="M 660 80 C 700 80 700 130 660 130 L 490 130 C 450 130 450 80 490 80" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="5 3"/>
	<path d="M 496 74 L 486 80 L 496 86 Z" fill="#4a5568"/>

	<rect x="700" y="50" width="160" height="60" rx="9" fill="#ffffff" stroke="#d9dfe8"/>
	<text x="780" y="76" text-anchor="middle" font-size="12" fill="#1c2330">それ以外</text>
	<text x="780" y="96" text-anchor="middle" font-size="11" fill="#4a5568">-32601 を返す</text>

	<text x="450" y="175" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">通知（id が無いメッセージ）には応答しない</text>
	<text x="450" y="198" text-anchor="middle" font-size="11" fill="#4a5568">例: notifications/initialized は「初期化が済んだ」という知らせで、返事は要らない</text>
	<text x="450" y="228" text-anchor="middle" font-size="11" fill="#a51f22">返事を返すと、相手は身に覚えのない応答を受け取ることになる</text>
</svg>
