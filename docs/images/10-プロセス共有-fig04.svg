<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="ブリッジは薄い中継役">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(70,78%,25%)"/><stop offset="1" stop-color="hsl(70,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="30" y="45" width="140" height="40" rx="7" fill="url(#i1)"/>
	<text x="100" y="70" text-anchor="middle" font-size="11" fill="#fff">Claude Code</text>
	<rect x="30" y="135" width="140" height="40" rx="7" fill="url(#i1)"/>
	<text x="100" y="160" text-anchor="middle" font-size="11" fill="#fff">Codex</text>

	<line x1="170" y1="65" x2="240" y2="65" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)"/>
	<line x1="170" y1="155" x2="240" y2="155" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)"/>

	<rect x="240" y="45" width="150" height="40" rx="7" fill="#b8620a"/>
	<text x="315" y="63" text-anchor="middle" font-size="11" fill="#fff">ブリッジ</text>
	<text x="315" y="78" text-anchor="middle" font-size="10" fill="#fff">軽い・状態を持たない</text>
	<rect x="240" y="135" width="150" height="40" rx="7" fill="#b8620a"/>
	<text x="315" y="153" text-anchor="middle" font-size="11" fill="#fff">ブリッジ</text>
	<text x="315" y="168" text-anchor="middle" font-size="10" fill="#fff">軽い・状態を持たない</text>

	<line x1="390" y1="65" x2="560" y2="100" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)"/>
	<line x1="390" y1="155" x2="560" y2="120" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)"/>

	<rect x="560" y="85" width="300" height="50" rx="8" fill="#1d7a3c"/>
	<text x="710" y="107" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">本体 1 本</text>
	<text x="710" y="125" text-anchor="middle" font-size="11" fill="#fff">重い初期化はここで 1 回だけ</text>

	<text x="450" y="205" text-anchor="middle" font-size="11" fill="#4a5568">ブリッジ側には何も置かない。置くと共有の意味が薄れる</text>
