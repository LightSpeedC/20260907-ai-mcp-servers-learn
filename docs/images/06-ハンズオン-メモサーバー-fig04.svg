<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="返す量を絞らないと会話が埋まる">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="225" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">全件返すと</text>
	<rect x="60" y="45" width="330" height="120" rx="8" fill="url(#i1)"/>
	<text x="225" y="80" text-anchor="middle" font-size="12" fill="#fff">1200 件のメモ本文</text>
	<text x="225" y="106" text-anchor="middle" font-size="12" fill="#fff">文脈の大半を占める</text>
	<text x="225" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">本題を押し出してしまう</text>

	<text x="675" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">絞って返すと</text>
	<rect x="510" y="45" width="330" height="120" rx="8" fill="url(#i2)"/>
	<text x="675" y="80" text-anchor="middle" font-size="12" fill="#fff">「1200 件のうち 10 件」</text>
	<text x="675" y="106" text-anchor="middle" font-size="12" fill="#fff">＋ 直近の 10 件</text>
	<text x="675" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">足りなければモデルが絞り直す</text>

	<text x="450" y="200" text-anchor="middle" font-size="11" fill="#4a5568">ツールの戻り値はそのまま文脈に入る。長さは設計事項</text>
</svg>
