<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="タスクの取得手順">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(70,78%,25%)"/><stop offset="1" stop-color="hsl(70,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="30" y="30" width="140" height="36" rx="7" fill="url(#i1)"/>
	<text x="100" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">呼ぶ側</text>
	<line x1="100" y1="66" x2="100" y2="240" stroke="#d9dfe8" stroke-width="2"/>

	<rect x="700" y="30" width="140" height="36" rx="7" fill="url(#i1)"/>
	<text x="770" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">サーバー</text>
	<line x1="770" y1="66" x2="770" y2="240" stroke="#d9dfe8" stroke-width="2"/>

	<line x1="100" y1="95" x2="770" y2="95" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)"/>
	<text x="435" y="88" text-anchor="middle" font-size="11" fill="#1c2330">tools/call（params に task を付ける）</text>

	<line x1="770" y1="120" x2="100" y2="120" stroke="#1d7a3c" stroke-width="1.8" marker-end="url(#i2)" stroke-dasharray="5 3"/>
	<text x="435" y="113" text-anchor="middle" font-size="11" font-weight="700" fill="#1d7a3c">taskId ・ status: working</text>

	<line x1="100" y1="155" x2="770" y2="155" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)"/>
	<text x="435" y="148" text-anchor="middle" font-size="11" fill="#1c2330">tasks/get（pollInterval ごとに）</text>

	<line x1="770" y1="180" x2="100" y2="180" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)" stroke-dasharray="5 3"/>
	<text x="435" y="173" text-anchor="middle" font-size="11" fill="#1c2330">working … working … completed</text>

	<line x1="100" y1="215" x2="770" y2="215" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i2)"/>
	<text x="435" y="208" text-anchor="middle" font-size="11" fill="#1c2330">tasks/result</text>

	<line x1="770" y1="238" x2="100" y2="238" stroke="#1d7a3c" stroke-width="1.8" marker-end="url(#i2)" stroke-dasharray="5 3"/>
	<text x="435" y="231" text-anchor="middle" font-size="11" font-weight="700" fill="#1d7a3c">本来の結果</text>
</svg>
