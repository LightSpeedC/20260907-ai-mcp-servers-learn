<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="MCPの通り道とOSの通知は別の経路">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(70,78%,25%)"/><stop offset="1" stop-color="hsl(70,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="330" y="100" width="220" height="60" rx="9" fill="#1d7a3c"/>
	<text x="440" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">MCP サーバー</text>
	<text x="440" y="146" text-anchor="middle" font-size="11" fill="#fff">ただのプロセス</text>

	<line x1="330" y1="118" x2="180" y2="80" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
	<rect x="20" y="55" width="160" height="50" rx="8" fill="url(#i1)"/>
	<text x="100" y="77" text-anchor="middle" font-size="12" fill="#fff">MCP の通り道</text>
	<text x="100" y="95" text-anchor="middle" font-size="11" fill="#fff">処理中しか使えない</text>

	<line x1="550" y1="140" x2="700" y2="180" stroke="#b8620a" stroke-width="2" marker-end="url(#i2)"/>
	<rect x="700" y="155" width="180" height="50" rx="8" fill="#b8620a"/>
	<text x="790" y="177" text-anchor="middle" font-size="12" fill="#fff">OS の通知</text>
	<text x="790" y="195" text-anchor="middle" font-size="11" fill="#fff">いつでも出せる</text>

	<text x="440" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2330">同じプロセスから、2 つの経路が使える</text>
	<text x="440" y="236" text-anchor="middle" font-size="11" fill="#4a5568">メール・Slack・音を鳴らす、も同じ考え方</text>
</svg>
