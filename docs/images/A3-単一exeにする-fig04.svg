<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="サーバーの言語が変わってもクライアントは同じ">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(70,78%,25%)"/><stop offset="1" stop-color="hsl(70,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="60" y="65" width="230" height="70" rx="9" fill="url(#i1)"/>
	<text x="175" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">テスト（Node）</text>
	<text x="175" y="116" text-anchor="middle" font-size="11" fill="#fff">1 つで両方を検証できる</text>

	<line x1="290" y1="85" x2="600" y2="60" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
	<line x1="290" y1="115" x2="600" y2="140" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="600" y="35" width="240" height="50" rx="8" fill="#1d7a3c"/>
	<text x="720" y="65" text-anchor="middle" font-size="12" fill="#fff">server.mjs（Node）</text>

	<rect x="600" y="120" width="240" height="50" rx="8" fill="#1d7a3c"/>
	<text x="720" y="150" text-anchor="middle" font-size="12" fill="#fff">mcp-server.exe（C#）</text>

	<text x="450" y="190" text-anchor="middle" font-size="11" fill="#4a5568">同じ応答を返すことを、同じテストで確かめられる</text>
</svg>
