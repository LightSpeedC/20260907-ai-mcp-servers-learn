<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="ビルド実行サーバーの流れ">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="30" y="90" width="150" height="50" rx="8" fill="url(#i1)"/>
	<text x="105" y="112" text-anchor="middle" font-size="12" fill="#fff">「テスト流して」</text>
	<text x="105" y="130" text-anchor="middle" font-size="11" fill="#fff">利用者</text>

	<line x1="180" y1="115" x2="240" y2="115" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="240" y="90" width="160" height="50" rx="8" fill="url(#i1)"/>
	<text x="320" y="112" text-anchor="middle" font-size="12" fill="#fff">build_run</text>
	<text x="320" y="130" text-anchor="middle" font-size="11" fill="#fff">name: "test"</text>

	<line x1="400" y1="115" x2="460" y2="115" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="460" y="65" width="180" height="100" rx="8" fill="#1d7a3c"/>
	<text x="550" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">一覧と照らす</text>
	<text x="550" y="115" text-anchor="middle" font-size="11" fill="#fff">あれば実行</text>
	<text x="550" y="136" text-anchor="middle" font-size="11" fill="#fff">無ければ断る</text>

	<line x1="640" y1="95" x2="720" y2="60" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
	<rect x="720" y="35" width="150" height="46" rx="8" fill="#b8620a"/>
	<text x="795" y="55" text-anchor="middle" font-size="11" fill="#fff">進捗を送る</text>
	<text x="795" y="72" text-anchor="middle" font-size="10" fill="#fff">1 行ごと</text>

	<line x1="640" y1="135" x2="720" y2="170" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
	<rect x="720" y="148" width="150" height="46" rx="8" fill="#b8620a"/>
	<text x="795" y="168" text-anchor="middle" font-size="11" fill="#fff">終わったら</text>
	<text x="795" y="185" text-anchor="middle" font-size="10" fill="#fff">トーストを出す</text>

	<text x="450" y="225" text-anchor="middle" font-size="11" fill="#4a5568">結果は末尾 30 行だけ返す。全部返すと会話が埋まる</text>
</svg>
