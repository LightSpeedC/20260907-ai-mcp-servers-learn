<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="zodの定義がJSON Schemaになりモデルに届くまで">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(70,78%,25%)"/><stop offset="1" stop-color="hsl(70,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="30" y="60" width="200" height="60" rx="8" fill="url(#i1)"/>
	<text x="130" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">zod の定義</text>
	<text x="130" y="104" text-anchor="middle" font-size="11" fill="#fff">z.number().describe(...)</text>

	<line x1="230" y1="90" x2="300" y2="90" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>
	<text x="265" y="82" text-anchor="middle" font-size="10" fill="#4a5568">SDK</text>

	<rect x="300" y="60" width="200" height="60" rx="8" fill="url(#i1)"/>
	<text x="400" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">JSON Schema</text>
	<text x="400" y="104" text-anchor="middle" font-size="11" fill="#fff">tools/list で送られる</text>

	<line x1="500" y1="90" x2="570" y2="90" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="570" y="60" width="200" height="60" rx="8" fill="#1d7a3c"/>
	<text x="670" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">モデルが読む</text>
	<text x="670" y="104" text-anchor="middle" font-size="11" fill="#fff">これだけを頼りに呼ぶ</text>

	<text x="450" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2330">describe を省くと、モデルは名前と型だけで推測することになる</text>
</svg>
