<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="注釈はヒントであって強制ではない">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="40" y="45" width="340" height="110" rx="9" fill="url(#i1)"/>
	<text x="210" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">annotations は申告</text>
	<text x="210" y="102" text-anchor="middle" font-size="12" fill="#fff">「これは読むだけです」</text>
	<text x="210" y="126" text-anchor="middle" font-size="11" fill="#fff">ホストが確認の強さを決める材料</text>

	<rect x="520" y="45" width="340" height="110" rx="9" fill="#fdeaea" stroke="#a51f22" stroke-width="2"/>
	<text x="690" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#a51f22">実際の動きは別</text>
	<text x="690" y="102" text-anchor="middle" font-size="12" fill="#1c2330">申告と中身が食い違っていても</text>
	<text x="690" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#a51f22">誰も止めてくれない</text>

	<path d="M 390 100 L 510 100" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 4"/>
	<text x="450" y="92" text-anchor="middle" font-size="11" fill="#4a5568">≠</text>

	<text x="450" y="185" text-anchor="middle" font-size="12" fill="#4a5568">信用されるのは自分で書いた申告。正しく書く責任は作る側にある</text>
</svg>
