<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Accept ヘッダの有無で応答が変わる">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(70,78%,25%)"/><stop offset="1" stop-color="hsl(70,58%,55%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="40" y="40" width="820" height="60" rx="8" fill="#ffffff" stroke="#1d7a3c" stroke-width="2"/>
	<text x="60" y="65" font-size="13" font-weight="700" fill="#1d7a3c">両方を書く</text>
	<text x="60" y="88" font-size="12" fill="#1c2330" font-family="monospace">Accept: application/json, text/event-stream</text>
	<text x="700" y="88" font-size="12" font-weight="700" fill="#1d7a3c">どちらで返っても受けられる</text>

	<rect x="40" y="115" width="820" height="60" rx="8" fill="#fdeaea" stroke="#a51f22" stroke-width="2"/>
	<text x="60" y="140" font-size="13" font-weight="700" fill="#a51f22">片方だけ</text>
	<text x="60" y="163" font-size="12" fill="#1c2330" font-family="monospace">Accept: application/json</text>
	<text x="700" y="163" font-size="12" font-weight="700" fill="#a51f22">406 で断られる</text>

	<text x="450" y="210" text-anchor="middle" font-size="11" fill="#4a5568">サーバーが SSE で返したいときに、受け取れる相手か確かめている</text>
</svg>
