<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="stdioと共有で誰が起動を持つかが変わる">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(30,78%,25%)"/><stop offset="1" stop-color="hsl(30,58%,55%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="225" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2330">stdio</text>
	<rect x="50" y="45" width="350" height="150" rx="9" fill="url(#i1)"/>
	<text x="225" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ホストが全部やる</text>
	<text x="225" y="110" text-anchor="middle" font-size="12" fill="#fff">起動する</text>
	<text x="225" y="134" text-anchor="middle" font-size="12" fill="#fff">終了させる</text>
	<text x="225" y="158" text-anchor="middle" font-size="12" fill="#fff">落ちたら起こし直す</text>
	<text x="225" y="182" text-anchor="middle" font-size="11" fill="#fff">こちらは何もしなくてよい</text>

	<text x="675" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2330">共有</text>
	<rect x="500" y="45" width="350" height="150" rx="9" fill="url(#i2)"/>
	<text x="675" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">自分が持つ</text>
	<text x="675" y="110" text-anchor="middle" font-size="12" fill="#fff">起動する仕掛けを用意する</text>
	<text x="675" y="134" text-anchor="middle" font-size="12" fill="#fff">落ちたことに気づく手立てを持つ</text>
	<text x="675" y="158" text-anchor="middle" font-size="12" fill="#fff">更新するとき、繋いでいる全員に影響</text>
	<text x="675" y="182" text-anchor="middle" font-size="11" fill="#fff">ここが共有の代償</text>

	<text x="450" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2330">1 本にまとめる利得と、面倒を見る手間を秤にかける</text>
</svg>
