<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Node版とexe版で配るものが違う">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="225" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2330">Node.js 版</text>
	<rect x="60" y="45" width="330" height="150" rx="9" fill="url(#i1)"/>
	<text x="225" y="76" text-anchor="middle" font-size="12" fill="#fff">server.mjs</text>
	<text x="225" y="100" text-anchor="middle" font-size="12" fill="#fff">＋ package.json</text>
	<text x="225" y="124" text-anchor="middle" font-size="12" fill="#fff">＋ node_modules（数十 MB）</text>
	<text x="225" y="148" text-anchor="middle" font-size="12" fill="#fff">＋ Node.js 本体</text>
	<text x="225" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">相手側に用意が要る</text>

	<text x="675" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2330">C# 版</text>
	<rect x="510" y="45" width="330" height="150" rx="9" fill="url(#i2)"/>
	<text x="675" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">mcp-server.exe</text>
	<text x="675" y="118" text-anchor="middle" font-size="12" fill="#fff">7,680 バイト（実測）</text>
	<text x="675" y="150" text-anchor="middle" font-size="12" fill="#fff">これ 1 つ</text>
	<text x="675" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">.NET Framework は OS 同梱</text>
</svg>
