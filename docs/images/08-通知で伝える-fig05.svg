<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="外部イベントから会話へ割り込む経路は無い">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="30" y="90" width="180" height="60" rx="9" fill="#b8620a"/>
	<text x="120" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">外で何か起きた</text>
	<text x="120" y="136" text-anchor="middle" font-size="11" fill="#fff">監視が異常を検知した</text>

	<line x1="210" y1="120" x2="320" y2="120" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="320" y="90" width="180" height="60" rx="9" fill="#1d7a3c"/>
	<text x="410" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">サーバーは知る</text>
	<text x="410" y="136" text-anchor="middle" font-size="11" fill="#fff">プロセスは動いている</text>

	<line x1="500" y1="120" x2="640" y2="120" stroke="#a51f22" stroke-width="3" stroke-dasharray="8 5"/>
	<text x="570" y="105" text-anchor="middle" font-size="26" font-weight="700" fill="#a51f22">×</text>
	<text x="570" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#a51f22">経路が無い</text>

	<rect x="640" y="90" width="220" height="60" rx="9" fill="#e8ecf3" stroke="#d9dfe8"/>
	<text x="750" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">会話に割り込む</text>
	<text x="750" y="136" text-anchor="middle" font-size="11" fill="#4a5568">モデルに知らせる</text>

	<line x1="410" y1="150" x2="410" y2="200" stroke="#1d7a3c" stroke-width="2" marker-end="url(#i2)"/>
	<rect x="290" y="200" width="240" height="46" rx="8" fill="#1d7a3c"/>
	<text x="410" y="222" text-anchor="middle" font-size="12" fill="#fff">OS の通知・メール・Slack</text>
	<text x="410" y="239" text-anchor="middle" font-size="11" fill="#fff">こちらは通る（人に届く）</text>
</svg>
