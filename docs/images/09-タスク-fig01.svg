<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="普通の呼び出しとタスクの違い">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
		<marker id="i3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="450" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2330">普通の呼び出し</text>
	<line x1="60" y1="80" x2="840" y2="80" stroke="#d9dfe8" stroke-width="2"/>
	<circle cx="140" cy="80" r="6" fill="hsl(0,58%,45%)"/>
	<text x="140" y="66" text-anchor="middle" font-size="11" fill="#1c2330">呼ぶ</text>
	<rect x="140" y="88" width="560" height="22" rx="5" fill="url(#i1)"/>
	<text x="420" y="104" text-anchor="middle" font-size="11" fill="#fff">ずっと待っている（接続を掴んだまま）</text>
	<circle cx="700" cy="80" r="6" fill="hsl(0,58%,45%)"/>
	<text x="700" y="66" text-anchor="middle" font-size="11" fill="#1c2330">結果</text>
	<text x="790" y="104" font-size="11" fill="#a51f22">途中で切れたら失う</text>

	<text x="450" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2330">タスク</text>
	<line x1="60" y1="215" x2="840" y2="215" stroke="#d9dfe8" stroke-width="2"/>
	<circle cx="140" cy="215" r="6" fill="hsl(140,58%,40%)"/>
	<text x="140" y="201" text-anchor="middle" font-size="11" fill="#1c2330">呼ぶ</text>
	<circle cx="200" cy="215" r="6" fill="hsl(140,58%,40%)"/>
	<text x="205" y="201" text-anchor="middle" font-size="11" fill="#1c2330">taskId が返る</text>

	<rect x="200" y="223" width="500" height="22" rx="5" fill="url(#i2)"/>
	<text x="450" y="239" text-anchor="middle" font-size="11" fill="#fff">裏で進む（呼んだ側は別のことができる）</text>

	<circle cx="360" cy="215" r="5" fill="#4a5568"/>
	<circle cx="500" cy="215" r="5" fill="#4a5568"/>
	<circle cx="640" cy="215" r="5" fill="#4a5568"/>
	<text x="500" y="201" text-anchor="middle" font-size="11" fill="#4a5568">ときどき様子を見る</text>

	<circle cx="700" cy="215" r="6" fill="hsl(140,58%,40%)"/>
	<text x="790" y="219" font-size="11" fill="#1d7a3c">結果を取りに行く</text>
</svg>
