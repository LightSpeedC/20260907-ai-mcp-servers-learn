<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="セッションを持たない構成では状態を外に置く">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="40" y="40" width="140" height="34" rx="7" fill="url(#i1)"/>
	<text x="110" y="62" text-anchor="middle" font-size="11" fill="#fff">リクエスト 1</text>
	<rect x="40" y="90" width="140" height="34" rx="7" fill="url(#i1)"/>
	<text x="110" y="112" text-anchor="middle" font-size="11" fill="#fff">リクエスト 2</text>
	<rect x="40" y="140" width="140" height="34" rx="7" fill="url(#i1)"/>
	<text x="110" y="162" text-anchor="middle" font-size="11" fill="#fff">リクエスト 3</text>

	<g stroke="#4a5568" stroke-width="1.6" marker-end="url(#i2)">
		<line x1="180" y1="57" x2="290" y2="57"/>
		<line x1="180" y1="107" x2="290" y2="107"/>
		<line x1="180" y1="157" x2="290" y2="157"/>
	</g>

	<rect x="290" y="40" width="230" height="34" rx="7" fill="#ffffff" stroke="#d9dfe8" stroke-dasharray="4 3"/>
	<text x="405" y="62" text-anchor="middle" font-size="11" fill="#4a5568">その場で作って捨てる</text>
	<rect x="290" y="90" width="230" height="34" rx="7" fill="#ffffff" stroke="#d9dfe8" stroke-dasharray="4 3"/>
	<text x="405" y="112" text-anchor="middle" font-size="11" fill="#4a5568">その場で作って捨てる</text>
	<rect x="290" y="140" width="230" height="34" rx="7" fill="#ffffff" stroke="#d9dfe8" stroke-dasharray="4 3"/>
	<text x="405" y="162" text-anchor="middle" font-size="11" fill="#4a5568">その場で作って捨てる</text>

	<g stroke="#4a5568" stroke-width="1.6" marker-end="url(#i2)">
		<line x1="520" y1="57" x2="660" y2="95"/>
		<line x1="520" y1="107" x2="660" y2="107"/>
		<line x1="520" y1="157" x2="660" y2="119"/>
	</g>

	<rect x="660" y="80" width="200" height="60" rx="8" fill="#1d7a3c"/>
	<text x="760" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">memo.jsonl</text>
	<text x="760" y="126" text-anchor="middle" font-size="11" fill="#fff">状態はここだけにある</text>

	<text x="450" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2330">サーバーの側に記憶を持たせないと、作り直しても平気になる</text>
	<text x="450" y="236" text-anchor="middle" font-size="11" fill="#4a5568">プロセスを再起動しても、複数台に増やしても、同じように動く</text>
