<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="isErrorとJSON-RPCエラーでモデルの動きが変わる">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/>
		</linearGradient>
		<marker id="i3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="40" y="40" width="240" height="70" rx="8" fill="url(#i1)"/>
	<text x="160" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">isError: true</text>
	<text x="160" y="88" text-anchor="middle" font-size="11" fill="#fff">「0 では割れません」</text>

	<line x1="280" y1="75" x2="360" y2="75" stroke="#4a5568" stroke-width="2" marker-end="url(#i3)"/>

	<rect x="360" y="40" width="500" height="70" rx="8" fill="#ffffff" stroke="#1d7a3c" stroke-width="2"/>
	<text x="610" y="66" text-anchor="middle" font-size="12" fill="#1c2330">モデルが本文を読む → b を 0 以外にして呼び直す</text>
	<text x="610" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#1d7a3c">利用者に何も訊かずに解決する</text>

	<rect x="40" y="140" width="240" height="70" rx="8" fill="url(#i2)"/>
	<text x="160" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">JSON-RPC エラー</text>
	<text x="160" y="188" text-anchor="middle" font-size="11" fill="#fff">code: -32603</text>

	<line x1="280" y1="175" x2="360" y2="175" stroke="#4a5568" stroke-width="2" marker-end="url(#i3)"/>

	<rect x="360" y="140" width="500" height="70" rx="8" fill="#fdeaea" stroke="#a51f22" stroke-width="2"/>
	<text x="610" y="166" text-anchor="middle" font-size="12" fill="#1c2330">ツールが壊れたと解釈される</text>
	<text x="610" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#a51f22">同じ失敗を繰り返すか、諦める</text>
</svg>
