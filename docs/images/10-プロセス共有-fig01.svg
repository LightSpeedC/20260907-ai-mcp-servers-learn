<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="ホストが増えるほどプロセスが増える">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/>
		</linearGradient>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<text x="450" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2330">stdio のまま、ホストを 3 つ・ウィンドウを 2 枚ずつ使うと</text>

	<g>
		<rect x="40" y="50" width="120" height="30" rx="6" fill="url(#i1)"/>
		<text x="100" y="70" text-anchor="middle" font-size="11" fill="#fff">Claude Code ①</text>
		<rect x="40" y="88" width="120" height="30" rx="6" fill="url(#i1)"/>
		<text x="100" y="108" text-anchor="middle" font-size="11" fill="#fff">Claude Code ②</text>
		<rect x="40" y="126" width="120" height="30" rx="6" fill="url(#i1)"/>
		<text x="100" y="146" text-anchor="middle" font-size="11" fill="#fff">Codex ①</text>
		<rect x="40" y="164" width="120" height="30" rx="6" fill="url(#i1)"/>
		<text x="100" y="184" text-anchor="middle" font-size="11" fill="#fff">Codex ②</text>
	</g>

	<g stroke="#4a5568" stroke-width="1.4">
		<line x1="160" y1="65" x2="280" y2="65"/>
		<line x1="160" y1="103" x2="280" y2="103"/>
		<line x1="160" y1="141" x2="280" y2="141"/>
		<line x1="160" y1="179" x2="280" y2="179"/>
	</g>

	<g>
		<rect x="280" y="50" width="150" height="30" rx="6" fill="#97a1ae"/>
		<text x="355" y="70" text-anchor="middle" font-size="11" fill="#fff">node 50 MB</text>
		<rect x="280" y="88" width="150" height="30" rx="6" fill="#97a1ae"/>
		<text x="355" y="108" text-anchor="middle" font-size="11" fill="#fff">node 50 MB</text>
		<rect x="280" y="126" width="150" height="30" rx="6" fill="#97a1ae"/>
		<text x="355" y="146" text-anchor="middle" font-size="11" fill="#fff">node 50 MB</text>
		<rect x="280" y="164" width="150" height="30" rx="6" fill="#97a1ae"/>
		<text x="355" y="184" text-anchor="middle" font-size="11" fill="#fff">node 50 MB</text>
	</g>

	<text x="355" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#a51f22">同じものが 4 つ。状態は共有されない</text>

	<path d="M 450 120 L 530 120" stroke="#4a5568" stroke-width="2"/>
	<path d="M 525 114 L 535 120 L 525 126 Z" fill="#4a5568"/>

	<rect x="560" y="95" width="300" height="50" rx="8" fill="#1d7a3c"/>
	<text x="710" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1 本にまとめたい</text>
	<text x="710" y="137" text-anchor="middle" font-size="11" fill="#fff">記憶も接続も 1 つで済む</text>

	<text x="710" y="180" text-anchor="middle" font-size="11" fill="#4a5568">ただし、起動と終了を自分で見る必要が出てくる</text>
</svg>
