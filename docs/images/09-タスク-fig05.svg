<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="ホストが対応していないと普通の呼び出しになる">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="40" y="50" width="230" height="60" rx="9" fill="url(#i1)"/>
	<text x="155" y="76" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">サーバーは対応済み</text>
	<text x="155" y="96" text-anchor="middle" font-size="11" fill="#fff">capabilities.tasks あり</text>

	<rect x="40" y="130" width="230" height="60" rx="9" fill="#97a1ae"/>
	<text x="155" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ホストは未対応</text>
	<text x="155" y="176" text-anchor="middle" font-size="11" fill="#fff">capabilities.tasks なし</text>

	<line x1="270" y1="120" x2="380" y2="120" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="380" y="95" width="230" height="50" rx="8" fill="#ffffff" stroke="#b8620a" stroke-width="2"/>
	<text x="495" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#b8620a">普通の呼び出しになる</text>
	<text x="495" y="136" text-anchor="middle" font-size="11" fill="#1c2330">エラーは出ない</text>

	<line x1="610" y1="120" x2="700" y2="120" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="700" y="95" width="170" height="50" rx="8" fill="#1d7a3c"/>
	<text x="785" y="118" text-anchor="middle" font-size="12" fill="#fff">ちゃんと動く</text>
	<text x="785" y="136" text-anchor="middle" font-size="11" fill="#fff">待つだけ</text>

	<text x="450" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2330">optional にしておけば、どちらの相手でも動く</text>
</svg>
