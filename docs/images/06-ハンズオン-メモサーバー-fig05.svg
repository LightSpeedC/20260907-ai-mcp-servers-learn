<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="テスト用クライアントはサーバーを子プロセスとして起こす">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="40" y="60" width="220" height="90" rx="9" fill="url(#i1)"/>
	<text x="150" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">テスト</text>
	<text x="150" y="114" text-anchor="middle" font-size="11" fill="#fff">node --test</text>
	<text x="150" y="134" text-anchor="middle" font-size="11" fill="#fff">SDK のクライアント</text>

	<line x1="260" y1="105" x2="380" y2="105" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)" marker-start="url(#i2)"/>
	<text x="320" y="97" text-anchor="middle" font-size="11" fill="#4a5568">stdio</text>

	<rect x="380" y="60" width="220" height="90" rx="9" fill="#1d7a3c"/>
	<text x="490" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">メモサーバー</text>
	<text x="490" y="114" text-anchor="middle" font-size="11" fill="#fff">ホストに登録せずに</text>
	<text x="490" y="134" text-anchor="middle" font-size="11" fill="#fff">そのまま起動できる</text>

	<line x1="600" y1="105" x2="700" y2="105" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="700" y="70" width="170" height="70" rx="9" fill="#ffffff" stroke="#d9dfe8" stroke-width="2"/>
	<text x="785" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2330">tmp/ のファイル</text>
	<text x="785" y="120" text-anchor="middle" font-size="11" fill="#4a5568">毎回消してから始める</text>

	<text x="450" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2330">ホストを起動しなくても、サーバー単体で検証できる</text>
	<text x="450" y="216" text-anchor="middle" font-size="11" fill="#4a5568">直してはホストを再起動、という往復が要らなくなる</text>
</svg>
