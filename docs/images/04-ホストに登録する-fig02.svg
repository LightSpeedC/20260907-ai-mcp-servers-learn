<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="Claude Code の登録から呼び出しまでの流れ">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/>
		</linearGradient>
		<marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="20" y="70" width="180" height="52" rx="8" fill="url(#i1)"/>
	<text x="110" y="93" text-anchor="middle" font-size="12" fill="#fff">.mcp.json に書く</text>
	<text x="110" y="111" text-anchor="middle" font-size="11" fill="#fff">または mcp add</text>

	<line x1="200" y1="96" x2="255" y2="96" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="255" y="70" width="180" height="52" rx="8" fill="url(#i1)"/>
	<text x="345" y="93" text-anchor="middle" font-size="12" fill="#fff">起動し直す</text>
	<text x="345" y="111" text-anchor="middle" font-size="11" fill="#fff">読み込みは起動時だけ</text>

	<line x1="435" y1="96" x2="490" y2="96" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="490" y="70" width="180" height="52" rx="8" fill="url(#i1)"/>
	<text x="580" y="93" text-anchor="middle" font-size="12" fill="#fff">承認する</text>
	<text x="580" y="111" text-anchor="middle" font-size="11" fill="#fff">プロジェクト範囲は初回のみ</text>

	<line x1="670" y1="96" x2="725" y2="96" stroke="#4a5568" stroke-width="2" marker-end="url(#i2)"/>

	<rect x="725" y="70" width="155" height="52" rx="8" fill="#1d7a3c"/>
	<text x="802" y="93" text-anchor="middle" font-size="12" fill="#fff">使える</text>
	<text x="802" y="111" text-anchor="middle" font-size="11" fill="#fff">mcp__memo__memo_add</text>

	<text x="450" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2330">ツールの名前は mcp__&lt;サーバー名&gt;__&lt;ツール名&gt; になる</text>
	<text x="450" y="192" text-anchor="middle" font-size="11" fill="#4a5568">同じツール名を持つサーバーが複数あっても、サーバー名で分かれる</text>
</svg>
