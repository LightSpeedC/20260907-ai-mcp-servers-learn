<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="ホストごとに異なる版で接続してくる">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/>
		</linearGradient>
		<marker id="i3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="40" y="40" width="200" height="46" rx="8" fill="url(#i1)"/>
	<text x="140" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Claude Code</text>
	<text x="140" y="79" text-anchor="middle" font-size="11" fill="#fff">2.1.263</text>

	<rect x="40" y="130" width="200" height="46" rx="8" fill="url(#i2)"/>
	<text x="140" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Codex</text>
	<text x="140" y="169" text-anchor="middle" font-size="11" fill="#fff">0.153.4</text>

	<line x1="240" y1="63" x2="620" y2="95" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i3)"/>
	<text x="430" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">"2025-11-25"</text>

	<line x1="240" y1="153" x2="620" y2="125" stroke="#4a5568" stroke-width="1.8" marker-end="url(#i3)"/>
	<text x="430" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">"2025-06-18"</text>

	<rect x="620" y="85" width="240" height="50" rx="8" fill="#1d7a3c"/>
	<text x="740" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">あなたのサーバー</text>
	<text x="740" y="124" text-anchor="middle" font-size="11" fill="#fff">来た版に合わせて返す</text>

	<text x="450" y="205" text-anchor="middle" font-size="11" fill="#4a5568">自分の対応版を押し付けず、相手が言ってきた版をそのまま返すのが安全</text>
</svg>
