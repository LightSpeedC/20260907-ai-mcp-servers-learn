<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="ホスト・クライアント・サーバーの関係と2つのトランスポート">
	<defs>
		<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(224,78%,25%)"/>
			<stop offset="1" stop-color="hsl(224,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(280,78%,25%)"/>
			<stop offset="1" stop-color="hsl(280,58%,55%)"/>
		</linearGradient>
		<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
			<stop offset="0" stop-color="hsl(112,78%,25%)"/>
			<stop offset="1" stop-color="hsl(112,58%,55%)"/>
		</linearGradient>
		<marker id="i4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
		</marker>
	</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

	<rect x="20" y="30" width="250" height="240" rx="12" fill="#ffffff" stroke="#d9dfe8"/>
	<text x="145" y="55" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2330">ホスト（AI CLI）</text>
	<text x="145" y="74" text-anchor="middle" font-size="12" fill="#4a5568">Claude Code / Codex / Antigravity</text>

	<rect x="45" y="95" width="200" height="52" rx="8" fill="url(#i2)"/>
	<text x="145" y="119" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MCP クライアント A</text>
	<text x="145" y="137" text-anchor="middle" font-size="11" fill="#fff">サーバー 1 本につき 1 つ</text>

	<rect x="45" y="163" width="200" height="52" rx="8" fill="url(#i2)"/>
	<text x="145" y="187" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MCP クライアント B</text>
	<text x="145" y="205" text-anchor="middle" font-size="11" fill="#fff">サーバー 1 本につき 1 つ</text>

	<line x1="270" y1="121" x2="560" y2="121" stroke="#4a5568" stroke-width="2" marker-end="url(#i4)" marker-start="url(#i4)"/>
	<text x="415" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">stdio</text>
	<text x="415" y="141" text-anchor="middle" font-size="11" fill="#4a5568">子プロセスの標準入出力・改行区切り JSON-RPC</text>

	<line x1="270" y1="189" x2="560" y2="189" stroke="#4a5568" stroke-width="2" marker-end="url(#i4)" marker-start="url(#i4)"/>
	<text x="415" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2330">Streamable HTTP</text>
	<text x="415" y="209" text-anchor="middle" font-size="11" fill="#4a5568">単一エンドポイントへの POST・応答は JSON か SSE</text>

	<rect x="560" y="95" width="320" height="52" rx="8" fill="url(#i3)"/>
	<text x="720" y="119" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MCP サーバー（子プロセス）</text>
	<text x="720" y="137" text-anchor="middle" font-size="11" fill="#fff">ホストごとに 1 本ずつ起動される</text>

	<rect x="560" y="163" width="320" height="52" rx="8" fill="url(#i3)"/>
	<text x="720" y="187" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MCP サーバー（常駐）</text>
	<text x="720" y="205" text-anchor="middle" font-size="11" fill="#fff">複数のホストから 1 本を共有できる</text>

	<text x="450" y="255" text-anchor="middle" font-size="12" fill="#4a5568">サーバーが提供するもの: Tools（実行する関数） / Resources（読ませるデータ） / Prompts（定型の指示）</text>
</svg>
